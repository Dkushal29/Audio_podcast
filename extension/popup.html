<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoSpace Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app" class="container">
      <header class="header">
        <div class="brand">
          <div class="logo-dot"></div>
          <div>
            <h1>EchoSpace</h1>
            <p class="subtitle">Listen. Understand. Discuss.</p>
          </div>
        </div>
        <button id="options-btn" class="icon-btn" title="Extension Settings">
          ⚙
        </button>
      </header>

      <!-- Auth View -->
      <section id="auth-view" class="panel hidden">
        <h2>Sign in to EchoSpace</h2>
        <p class="muted">
          Annotate YouTube videos &amp; web media and sync directly with your workspace.
        </p>
        <form id="login-form" class="stack">
          <label>
            Email
            <input type="email" id="login-email" required placeholder="you@example.com" />
          </label>
          <label>
            Password
            <input type="password" id="login-password" required placeholder="••••••••" />
          </label>
          <p id="auth-error" class="error hidden"></p>
          <button type="submit" class="btn-primary">Sign In</button>
        </form>
      </section>

      <!-- Main Capture View -->
      <section id="capture-view" class="panel hidden">
        <div class="user-bar">
          <span id="user-name" class="user-pill"></span>
          <button id="logout-btn" class="link-btn">Sign out</button>
        </div>

        <div class="mode-switch">
          <button type="button" data-mode="STUDY" class="mode-btn active">
            Study Mode
          </button>
          <button type="button" data-mode="CREATOR" class="mode-btn">
            Creator Mode
          </button>
        </div>

        <div id="media-status" class="media-card">
          <div class="media-card-row">
            <img id="media-thumb" class="media-thumb hidden" alt="Video thumbnail" />
            <div class="media-info">
              <div class="media-badges">
                <span id="provider-badge" class="badge hidden">YouTube</span>
                <span id="playback-badge" class="badge badge-muted hidden">Paused</span>
              </div>
              <p class="media-title" id="media-title">Scanning current tab...</p>
              <p class="media-meta" id="media-meta"></p>
            </div>
          </div>
          <button type="button" id="refresh-media-btn" class="btn-secondary-sm">
            Refresh
          </button>
        </div>

        <form id="annotate-form" class="stack">
          <label>
            Workspace
            <select id="workspace-select" required></select>
          </label>

          <div class="quick-actions" role="group" aria-label="Quick actions">
            <button type="button" data-action="ANNOTATE" class="action-pill active">
              Annotate
            </button>
            <button type="button" data-action="QUESTION" class="action-pill">
              Ask Question
            </button>
            <button type="button" data-action="BOOKMARK" class="action-pill">
              Bookmark
            </button>
            <button type="button" data-action="DISCUSS" class="action-pill">
              Share Moment
            </button>
          </div>

          <div class="row-2">
            <label id="category-label">
              Category
              <select id="category-select"></select>
            </label>
            <label>
              Timestamp
              <input
                type="text"
                id="timestamp-input"
                placeholder="0:00"
                required
              />
            </label>
          </div>

          <label>
            <span id="note-label">Annotation</span>
            <textarea
              id="note-input"
              rows="3"
              placeholder="Write a timestamped note, question, or @teammate mention..."
            ></textarea>
          </label>

          <p id="capture-error" class="error hidden"></p>
          <p id="capture-success" class="success hidden"></p>

          <div class="actions">
            <button type="submit" id="save-btn" class="btn-primary">
              Save Annotation
            </button>
            <button type="button" id="open-app-btn" class="btn-secondary">
              View Video
            </button>
            <button type="button" id="open-ws-btn" class="btn-secondary">
              Workspace
            </button>
          </div>
        </form>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
