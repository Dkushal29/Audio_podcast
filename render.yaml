databases:
  - name: echospace-db
    plan: free
    databaseName: echospace
    user: echospace

services:
  - type: web
    name: echospace-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: echospace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: ALLOW_EXTENSION_CORS
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        value: https://t3.storage.dev
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: echospace.media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_MODEL
        value: nova-2

  - type: worker
    name: echospace-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: echospace-db
          property: connectionString
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        value: https://t3.storage.dev
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: echospace.media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_MODEL
        value: nova-2
